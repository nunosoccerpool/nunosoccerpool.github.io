<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2028 Euro Pool - Pool A Standings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        /* Global Font: Verdana */
        body { background-color: #ffffff; font-family: Verdana, Geneva, sans-serif; margin: 0; }
        
        /* Navigation Bar Styling */
        .navbar { 
            background-color: #3a5a40; 
            margin-bottom: 0; 
            border-bottom: 4px solid #FFD700; 
            padding: 8px 20px;
            position: relative;
            z-index: 100;
        }
        .navbar-brand { font-weight: bold; letter-spacing: 1px; color: #ffffff !important; }
        .navbar-collapse { justify-content: center; }

        .nav-link { 
            color: rgba(255,255,255,0.85) !important; 
            margin: 0 5px;
            padding: 8px 18px !important;
            font-size: 0.85rem;
            text-transform: uppercase;
            border-radius: 25px; 
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        /* Removed gold border from active pill */
        .nav-link.active { 
            color: #ffffff !important; 
            background-color: #5a8562 !important; 
            font-weight: bold;
            text-decoration: none !important;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
        }
        
        .nav-link:hover:not(.active) {
            color: #ffffff !important;
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Viewing Dropdown Button*/
		.btn-pool-switch {
			background-color: #2d4531 !important; 
			color: white !important;
			border: 1px solid #FFD700 !important;  /* ← change this line */
			font-weight: bold;
			font-size: 0.85rem;
			box-shadow: none !important;
		}
		
		.btn-pool-switch:hover {
			border: 1px solid transparent !important;
		}
		
		/* White background base for all dropdown items */
		.dropdown-item {
			background-color: #ffffff !important;
			color: #212529 !important;
		}
        
        .dropdown-item:hover:not(.active) {
            background-color: #f8f9fa !important; 
            color: #212529 !important;
        }

		.dropdown-item[href*="standings-a"]:hover {
			background-color: #5a8562 !important;
			color: #ffffff !important;
		}

		.dropdown-item[href*="standings-b"]:hover {
			background-color: #a33838 !important;
			color: #ffffff !important;
		}

        /* Titles */
        .header-full-width { 
            background-color: #ffffff; 
            width: 100%; 
            padding: 30px 0 10px 0; 
            text-align: center; 
            margin: 0; 
        }
        .pool-title { font-size: 2.5rem; font-weight: bold; color: #3a5a40; margin-bottom: 25px; text-transform: uppercase; }
        .standings-title { font-size: 6rem; color: #3a5a40; text-transform: uppercase; letter-spacing: 4px; font-weight: bold; margin: 0; line-height: 1; }
        .last-updated { font-size: 0.9rem; color: #888; margin-top: 10px; }

        /* Table Container */
        .master-table-container {
            margin: 20px auto;
            max-width: fit-content;
            background-color: #ffffff;
            border: 2px solid #3a5a40; 
            border-radius: 15px;      
            box-shadow: 0 15px 60px 5px rgba(58, 90, 64, 0.4); 
            padding: 50px; 
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            overflow-x: auto;
        }

        .table-wrapper { display: flex; flex-direction: column; }
        .table-title { font-size: 0.85rem; color: #999; margin-bottom: 8px; height: 20px; text-align: center; }

        .table { 
            border-collapse: separate; 
            border-spacing: 0; 
            margin-bottom: 0;
            width: auto !important;
            table-layout: fixed;
            font-family: Verdana, Geneva, sans-serif !important;
        }

        .table td { 
            vertical-align: middle; 
            text-align: center; 
            border: 0.5px solid #dee2e6; 
            padding: 2px 6px !important; 
            height: 36px; 
            font-size: 16px !important; 
        }

        tbody td.col-points-group, tbody td.col-points-bracket, tbody td.col-points-possible, tbody td.col-bonus { 
            color: #969696 !important; 
        }

        tbody td.col-rank, tbody td.col-total { font-size: 18px !important; line-height: 1.1 !important; font-weight: bold !important; }
        tbody td.col-participant, tbody td.col-spacer { font-size: 24px !important; line-height: 1.1 !important; }

        .table td.col-participant { font-weight: normal !important; text-align: left !important; white-space: nowrap; }
        thead th { height: 85px !important; border: 0.5px solid #dee2e6; vertical-align: middle; text-align: center; font-size: 18px !important; }

        .header-caps { text-transform: uppercase; font-weight: bold !important; color: #000000; }
        
        thead th.col-points { 
            color: #969696 !important; 
            font-weight: normal !important; 
            text-transform: none !important; 
            background-color: #F2F2F2 !important;
        }

        thead th.col-bonus-header { 
            color: #969696 !important; 
            font-weight: normal !important; 
            text-transform: none !important; 
            background-color: #FAFAFA !important; 
        }
        
        .header-grey { background-color: #F2F2F2 !important; }
        
        /* Column Widths */
        .col-rank { width: 50px !important; }
        .col-participant { width: 155px !important; }
        .col-spacer { width: 35px !important; border-left: none !important; border-right: none !important; }
        .col-total { width: 85px !important; }
        .col-points-group, .col-points-bracket { width: 75px !important; }
        .col-points-possible { width: 80px !important; }
        .col-bonus { width: 75px !important; }

        .vertical-header { width: 20px !important; min-width: 20px !important; padding: 2px 0 !important; line-height: 1.1; font-weight: normal !important; }
        tbody td.vertical-header { color: #969696 !important; }
        thead .vertical-header { font-size: 14px !important; color: #000000 !important; }

        .game-side-left { border-left: none !important; border-right: 0.5px solid #dee2e6 !important; }
        .game-side-right { border-left: none !important; border-right: none !important; }
        thead .game-side-left { border-left: 2px solid #dee2e6 !important; }
        thead .game-side-right { border-right: 2px solid #dee2e6 !important; }

        .game-gap { width: 10px !important; border: none !important; background-color: transparent !important; }
        .table a { text-decoration: none; color: #000000 !important; }
        .table a:hover { text-decoration: underline; }

        /* Highlight Colors */
        .bg-top-five { background-color: #CCFFCC !important; }
        .bg-standard { background-color: #F2F2F2 !important; } 
        .bg-top-five-bonus { background-color: #E5FFE5 !important; }
        .bg-standard-bonus { background-color: #FAFAFA !important; }

        .stack-header { display: inline-block; width: min-content; line-height: 1.1; }
		
		@media (max-width: 768px) {
			.standings-title { font-size: 2.5rem; letter-spacing: 1px; }
			.pool-title { font-size: 1.5rem; }
			.master-table-container {
				flex-direction: row;
				padding: 15px;
				margin: 10px;
				overflow-x: auto;
			    #stats-table .col-rank,
				#stats-table .col-participant {
					position: sticky;
					background-color: inherit;
					z-index: 2;
				}

				#stats-table .col-rank {
					left: 0;
				}

				#stats-table .col-participant {
					left: 50px; /* matches col-rank width */
				}
}
			}
		}
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="standings-a.html">EURO 2028</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
		<div class="collapse navbar-collapse" id="navbarNav">
			<div class="navbar-nav">
				<a class="nav-link active" href="standings-a.htm">Standings</a>
				<a class="nav-link" href="prizes-a.htm">Prizes</a>
				<a class="nav-link" href="stats-a.htm">Stats</a>
				<a class="nav-link" href="tallies-a.htm">Tallies</a>
				<a class="nav-link" href="points-a.htm">Points System</a>
				<hr class="d-lg-none border-secondary my-1">
				<a class="nav-link d-lg-none" href="\poolb\standings-b.htm">View Pool B</a>
			</div>
		</div>
        
        <div class="dropdown d-none d-lg-block">
            <button class="btn btn-pool-switch dropdown-toggle" type="button" data-bs-toggle="dropdown">
                VIEWING: POOL A
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                 <li><a class="dropdown-item" href="\poolb\standings-b.htm">Switch to Pool B</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="header-full-width">
    <h1 class="pool-title">2028 EURO POOL (A)</h1>
    <h2 class="standings-title">Standings</h2>
    <div class="last-updated" id="update-timestamp">Loading...</div>
</div>

<div class="master-table-container">
    <div class="table-wrapper">
        <div class="table-title"></div> 
        <table class="table table-sm" id="stats-table">
            <thead>
                <tr>
                    <th class="col-rank header-grey header-caps">RANK</th>
                    <th class="col-participant header-grey header-caps">PARTICIPANT</th>
                    <th class="col-spacer header-grey"></th>
                    <th class="col-total header-grey header-caps"><span class="stack-header">TOTAL POINTS</span></th>
                    <th class="col-points-group col-points"><span class="stack-header">Group Stage Points</span></th>
                    <th class="col-points-bracket col-points"><span class="stack-header">Bracket Stage Points</span></th>
                    <th class="col-points-possible col-points"><span class="stack-header">Possible Points Left</span></th>
                    <th class="col-bonus col-bonus-header"><span>Bonus Game</span></th>
                </tr>
            </thead>
            <tbody id="stats-body"></tbody>
        </table>
    </div>

    <div class="table-wrapper">
        <div class="table-title">Upcoming Match Predictions</div>
        <table class="table table-sm" id="preds-table">
            <thead><tr id="preds-header-row"></tr></thead>
            <tbody id="preds-body"></tbody>
        </table>
    </div>
</div>

<script>
    /* Script logic remains identical to load JSON data */
    function formatDate(isoString) {
        const date = new Date(isoString);
        const options = { month: 'long', day: 'numeric', year: 'numeric' };
        const datePart = date.toLocaleDateString('en-US', options);
        let hours = date.getHours();
        const minutes = date.getMinutes().toString().padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        return `${datePart} @ ${hours}:${minutes} ${ampm}`;
    }

    async function loadStandings() {
        try {
            const response = await fetch('standings-a.json');
            const data = await response.json();
            document.getElementById('update-timestamp').innerHTML = `<b>Last updated on:</b> <i>${formatDate(data.metadata.last_updated)}</i>`;

            const statsBody = document.getElementById('stats-body');
            const predsHeadRow = document.getElementById('preds-header-row');
            const predsBody = document.getElementById('preds-body');

            data.metadata.header_stacks.forEach((stack, idx) => {
                const sideClass = (idx % 2 === 0) ? "game-side-left" : "game-side-right";
                const th = document.createElement('th');
                th.className = `vertical-header ${sideClass}`;
                th.innerHTML = `${stack.top}<br>${stack.mid}<br>${stack.btm}`;
                predsHeadRow.appendChild(th);
                if (idx % 2 === 1 && idx < 8) {
                    const gap = document.createElement('th');
                    gap.className = "game-gap";
                    predsHeadRow.appendChild(gap);
                }
            });

            data.standings.forEach((row, index) => {
                const isTopFive = index < 5;
                const mainRowClass = isTopFive ? 'bg-top-five' : 'bg-standard';
                const bonusRowClass = isTopFive ? 'bg-top-five-bonus' : 'bg-standard-bonus';
                const renderLink = (val, url) => (val === "" || val == null) ? "" : `<a href="${url}">${val}</a>`;

                const trStats = document.createElement('tr');
                trStats.innerHTML = `
                    <td class="col-rank ${mainRowClass}">${row.rank}</td>
                    <td class="col-participant ${mainRowClass}"><a href="${row.participant_url}">${row.participant}</a></td>
                    <td class="col-spacer ${mainRowClass}">${row.spacer_val || ""}</td>
                    <td class="col-total ${mainRowClass}">${row.total_points}</td>
                    <td class="col-points-group ${mainRowClass}">${renderLink(row.group_points, row.group_url)}</td>
                    <td class="col-points-bracket ${mainRowClass}">${renderLink(row.bracket_points, row.bracket_url)}</td>
                    <td class="col-points-possible ${mainRowClass}">${renderLink(row.possible_left, row.possible_url)}</td>
                    <td class="col-bonus ${bonusRowClass}">${renderLink(row.bonus_game, row.bonus_url)}</td>
                `;
                statsBody.appendChild(trStats);

                const trPreds = document.createElement('tr');
                row.preds.forEach((p, idx) => {
                    const sideClass = (idx % 2 === 0) ? "game-side-left" : "game-side-right";
                    const td = document.createElement('td');
                    td.className = `vertical-header ${sideClass}`;
                    td.innerText = p;
                    trPreds.appendChild(td);
                    if (idx % 2 === 1 && idx < 8) {
                        const gapTd = document.createElement('td');
                        gapTd.className = "game-gap";
                        trPreds.appendChild(gapTd);
                    }
                });
                predsBody.appendChild(trPreds);
            });
        } catch (e) { console.error("Load Error:", e); }
    }
    loadStandings();
</script>
</body>
</html>
