<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonus Game Points</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        html { width: 100%; }
        *, *::before, *::after { box-sizing: border-box; }
        body { 
            font-family: Verdana, Geneva, sans-serif; 
            margin: 0; padding: 0; width: 100%;
            background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url('/images/grass.png') center center fixed;
            background-size: cover;
        }
        .container { max-width: 640px; margin: auto; padding: 20px; }
        .card {
            background: white; border: 1px solid #ccc; margin-bottom: 16px;
            padding: 12px 6px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.35);
        }
        h1 { text-align: center; color: #2c3e50; white-space: nowrap; margin-top: 4px; margin-bottom: 4px; font-size: 2em; }

        .total-box {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background-color: #000; color: #fff; font-weight: bold;
            border-radius: 12px; width: 120px; height: 80px;
            margin: 4px auto 4px auto;
        }
        .total-box .total-val { font-size: 3em; line-height: 1.1; }

        /* BONUS GRID: same 3-col structure as bracket */
        .bonus-grid {
            display: grid;
            grid-template-columns: 0.67fr 70px 0.67fr;
            gap: 0;
            align-items: stretch;
        }
        .bracket-header {
            font-weight: bold; background: #e9ecef;
            padding: 6px 8px; border-radius: 4px;
            text-align: center; font-size: 1em;
        }

        /* Question row: spans all 3 columns */
        .question-row {
            grid-column: 1 / -1;
            font-size: 0.88em;
            font-style: italic;
            color: #444;
            padding: 8px 6px 4px 6px;
            background: #f5f5f5;
            border-radius: 4px;
            text-align: center;
            white-space: normal;
        }

        /* Answer row cells */
        .ans-cell {
            padding: 5px 8px;
            font-size: 0.95em;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            overflow: hidden;
        }
        /* Color change for Predicted values */
        .ans-cell.predicted { color: #004cff; text-align: center; }
        /* Color change for Actual values (changed from #1a6bbf to black) */
        .ans-cell.actual    { color: #000000; font-weight: bold; text-align: center; }

        .pts-span {
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4em; font-weight: bold;
            border-radius: 3px;
			min-height: 1.6em; min-width: 2em; 
        }
        .pts-zero { background-color: #FFC7CE; color: #EA002D; }
        .pts-pos  { background-color: #C6EFCE; color: #006100; }
        .pts-none { background-color: #e9ecef; color: #aaa; }

        /* Separator between sets */
        .set-divider {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            margin: 12px 0 12px 0;
        }
        .set-divider hr {
            flex: 1;
            border: none;
            border-top: 3px solid #d0d0d0;
            margin: 0;
        }

        .sticky-header { position: sticky; top: 0; z-index: 999; background-color: #e3e7e8; }
        .sticky-header .container { max-width: 100%; width: 100%; padding-left: 10px; padding-right: 10px; padding-top: 4px; padding-bottom: 4px; }
        .sticky-divider { border: none; border-top: 2px solid #dee2e6; margin: 0; }

        @media (max-width: 700px) {
            .container { width: 100%; max-width: 100%; padding: 4px 6px; box-sizing: border-box; }

            .bonus-grid { grid-template-columns: 0.67fr 0.2fr 0.67fr; }
            .ans-cell { font-size: 0.8em; padding: 4px 4px; }
            .question-row { font-size: 0.8em; }
            h1 { font-size: 1.4em; margin-top: 2px; margin-bottom: 2px; }
            .total-box { width: 90px; height: 60px; margin: 0 auto; }
            .total-box .total-val { font-size: 2.2em; }
			.pts-span { min-height: 2em; }
        }
    </style>
    <script>
      function fitTitle() {
        const h1 = document.getElementById('participantTitle');
        if (window.innerWidth > 700) return;
        let size = 28;
        h1.style.fontSize = size + 'px';
        while (h1.scrollWidth > h1.offsetWidth && size > 10) {
          size--;
          h1.style.fontSize = size + 'px';
        }
      }
      window.addEventListener('load', fitTitle);
      window.addEventListener('resize', fitTitle);

      function fitAnsCells() {
        if (window.innerWidth > 700) return;
        document.querySelectorAll('.ans-cell').forEach(cell => {
          cell.style.fontSize = '';
          let size = parseFloat(getComputedStyle(cell).fontSize);
          while (cell.scrollWidth > cell.offsetWidth && size > 8) {
            size -= 0.5;
            cell.style.fontSize = size + 'px';
          }
        });
      }
      window.addEventListener('resize', fitAnsCells);
    </script>
    <script>
        fetch('../navbar.html')
            .then(r => r.text())
            .then(html => {
                document.getElementById('navbar').innerHTML = html;
            });
    </script>
</head>
<body>

<div class="sticky-header">
    <div id="navbar"></div>
    <div class="container">
        <h1 id="participantTitle">Loading...</h1>
        <div id="totalBox"></div>
    </div>
    <hr class="sticky-divider">
</div>

<div class="container">
    <div id="content"></div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const rawName = params.get('name') || "Participant";
    document.getElementById('participantTitle').innerText = `${rawName}'s BONUS GAME Points`;

    const QUESTIONS = [
        { key: 'question1',  label: 'First team to score 5 goals in one match' },
        { key: 'question2',  label: 'Team of the first player to score 3 goals in one match' },
        { key: 'question3',  label: 'First team to be awarded a penalty shot' },
        { key: 'question4',  label: 'First team to score an own-goal' },
        { key: 'question5',  label: 'Total goals scored via penalty shot (not incl. shootouts)' },
        { key: 'question6',  label: 'First \u201cstraight\u201d red card went to a player from this team' },
        { key: 'question7',  label: 'First \u201ctwo yellow\u201d red card went to a player from this team' },
        { key: 'question8',  label: 'Total number of red cards in the tournament' },
        { key: 'question9',  label: 'Total number of yellow cards in the tournament' },
        { key: 'question10', label: 'Most yellow cards in one game shown to this team' },
        { key: 'question11', label: 'Total number of goals scored in the tournament (not incl. penalty shootout)' },
        { key: 'question12', label: 'Total number of games that went go to a penalty shootout' },
        { key: 'question13', label: 'The first goal in the Finals match was scored between these minutes' },
        { key: 'question14', label: 'Total yellow cards shown in the Finals match' },
        { key: 'question15', label: 'Total red cards shown in the Finals match' },
        { key: 'question16', label: 'Did the World Cup Final go to penalty shootout?' },
        { key: 'question17', label: 'Team with the fastest goal of the tournament' },
        { key: 'question18', label: 'Group Stage game with the highest combined goals' },
        { key: 'question19', label: 'First Group Stage game with two penalties awarded' },
        { key: 'question20', label: 'First Group Stage game with 0 cards shown' },
    ];

    fetch('/json/bonus_pts.json')
        .then(response => response.json())
        .then(data => {
            const pData = data[rawName] || {};

            document.getElementById('totalBox').innerHTML = `
                <div class="total-box">
                    <div class="total-val">${pData.total_points ?? '—'}</div>
                </div>`;

            let html = `<div class="card">
                <div class="bonus-grid">
                    <div class="bracket-header">Predicted</div>
                    <div class="bracket-header">Pts</div>
                    <div class="bracket-header">Actual</div>
                    <div style="height:8px"></div><div style="height:8px"></div><div style="height:8px"></div>`;

            QUESTIONS.forEach((q, i) => {
                const row = (pData[q.key]) || {};
                const predicted  = row.predicted  ?? '';
                const actual     = row.actual      ?? '';
                const pts        = row.pts_awarded;
                const ptsClass   = pts == null ? 'pts-none' : pts === 0 ? 'pts-zero' : 'pts-pos';
                const ptsDisplay = pts ?? '';

                // Separator before every set except the first
                if (i > 0) {
                    html += `<div class="set-divider"><hr></div>`;
                }

                // Question row spanning all 3 columns
                html += `<div class="question-row">${q.label}</div>`;

                // Answer row
                html += `
                    <div class="ans-cell predicted">${predicted}</div>
                    <div class="pts-span ${ptsClass}">${ptsDisplay}</div>
                    <div class="ans-cell actual">${actual}</div>`;
            });

            html += `</div></div>`;
            document.getElementById('content').innerHTML = html;
            fitAnsCells();
        })
        .catch(err => {
            document.getElementById('content').innerHTML = `<p style="color:red">Error loading data: ${err.message}</p>`;
        });
</script>

<div id="chatbot-placeholder"></div>
<script>
  fetch('/chatbot.html')
    .then(r => r.text())
    .then(html => {
      const placeholder = document.getElementById('chatbot-placeholder');
      // Inject the non-script HTML
      placeholder.innerHTML = html;
      // Re-execute any scripts manually
      placeholder.querySelectorAll('script').forEach(oldScript => {
        const newScript = document.createElement('script');
        newScript.textContent = oldScript.textContent;
        document.body.appendChild(newScript);
      });
    });
</script>
</body>
</html>
