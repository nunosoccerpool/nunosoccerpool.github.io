<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Total Points</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        html { width: 100%; }
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: Verdana, Geneva, sans-serif;
            margin: 0; padding: 0; width: 100%;
            background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url('/images/grass.png') center center fixed;
            background-size: cover;
        }
        
        /* Restored original container size so Group Matches and Group Ranks are untouched */
        .container { max-width: 680px; margin: auto; padding: 20px; }
        
        .card {
            background: white; border: 1px solid #ccc; margin-bottom: 16px;
            padding: 12px 16px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.35);
        }
        
        /* Specific override class to clone the knockout_pts.htm card sizing safely */
        .knockout-card {
            max-width: 520px;
            margin-left: auto;
            margin-right: auto;
        }

        h1 { text-align: center; color: #2c3e50; white-space: nowrap; margin-top: 4px; margin-bottom: 4px; font-size: 2em; }
        h2 { text-align: center; color: #86e5f0; margin-top: 16px; }
        h3 { text-align: left; color: #555; margin-top: 0; font-size: 1.2em; }
        
        /* Center text for knockout section h3 headers to completely match knockout_pts.htm */
        .knockout-title { text-align: center; }

        /* MATCHES GRID */
        .match-grid {
            display: grid; grid-template-columns: 1fr 105px 105px 105px;
            gap: 6px; padding: 5px 8px; border-bottom: 1px solid #eee; align-items: center;
        }
        .header { font-weight: bold; background: #e9ecef; border-radius: 4px; }
        .match-grid span:first-child { text-align: left; }
        .match-grid span:nth-child(n+2) { text-align: center; }
        .match-grid span:last-child { justify-self: center; }
        .match-grid .cell-matchup span:first-child::after { content: ' vs '; }
        .match-grid .cell-pred span:first-child::after { content: ' - '; }
        .match-grid .cell-act span:first-child::after { content: ' - '; }
        .match-grid .cell-matchup span,
        .match-grid .cell-pred span,
        .match-grid .cell-act span { display: inline; }
        
        /* Font color change for Group Matches Predicted values */
        .match-grid .cell-pred { color: #004cff; }

        /* RANKINGS GRID */
        .rank-grid {
            display: grid; grid-template-columns: 1fr 0.5fr 1fr;
            gap: 4px; align-items: center; text-align: center;
        }
        .rank-header { font-weight: bold; background: #e9ecef; padding: 4px; border-radius: 4px; }
        .rank-col { text-align: center; }
        .rank-item { padding: 3px; border-bottom: 1px solid #eee; font-size: 0.9em; }
        
        /* Font color change for Group Rank Predicted column entries */
        .rank-col-pred .rank-item { color: #004cff; }

        /* Conditional Point Styles - Group */
        .pts-0 { background-color: #FFC7CE; color: #EA002D; font-weight: bold; padding: 2px 16px; border-radius: 3px; display: inline-block; min-width: 24px; }
        .pts-1 { background-color: #FFF49F; color: #CC7000; font-weight: bold; padding: 2px 16px; border-radius: 3px; display: inline-block; min-width: 24px; }
        .pts-2 { background-color: #C6EFCE; color: #006100; font-weight: bold; padding: 2px 16px; border-radius: 3px; display: inline-block; min-width: 24px; }

        /* Rank Specific Conditional Styles */
        .pts-cell { grid-column: 2; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: center; text-align: center; }
        .pts-val { font-size: 2em; font-weight: bold; }
        .pts-low { background-color: #FFC7CE; color: #EA002D; border-radius: 3px; }
        .pts-mid { background-color: #FFF49F; color: #CC7000; border-radius: 3px; }
        .pts-high { background-color: #C6EFCE; color: #006100; border-radius: 3px; }

        /* BRACKET GRID - Cloned exactly from knockout_pts.htm */
        .bracket-grid {
            display: grid;
            grid-template-columns: 0.67fr 70px 0.67fr;
            gap: 0;
            align-items: stretch;
        }
        .bracket-header {
            font-weight: bold; background: #e9ecef;
            padding: 6px 8px; border-radius: 4px;
            text-align: center; font-size: 1em;
        }
        .game-cell { padding: 4px 2px 4px 8px; font-size: 1em; }
        .game-cell.predicted { padding-left: 16px; padding-right: 32px; }
        .game-cell.actual    { padding-right: 18px; }
        .team-row { display: flex; align-items: center; }
        .team-name { flex: 1; text-align: right; padding-right: 8px; }
        .team-score { width: 25px; text-align: left; font-weight: bold; }
        
        /* Font color change for Knockout Stage Predicted score column */
        .game-cell.predicted .team-score { color: #004cff; }
        
        .game-cell.actual .team-score { color: #000; }
		.pts-span {
			display: flex; align-items: center; justify-content: center;
			font-size: 1.6em; font-weight: bold; border-radius: 3px;
			min-height: 56px;
		}
        .pts-zero  { background-color: #FFC7CE; color: #EA002D; }
        .pts-pos   { background-color: #C6EFCE; color: #006100; }
        .pts-empty { background-color: #e9ecef; color: #6c757d; }
        .game-divider { grid-column: 1 / -1; border: none; margin: 10px 0; }

        /* Champion card - Cloned exactly from knockout_pts.htm */
        .champion-pts { min-height: 96px; font-size: 1.8em; }
        .champion-row {
            display: flex; align-items: center; justify-content: center;
            padding-left: 0 !important; padding-right: 0 !important;
        }
        .champion-row .team-row { width: 100%; justify-content: center; align-items: center; }
        .champion-row .team-name {
            flex: 0 0 auto; text-align: center; padding-right: 0;
            text-transform: uppercase; font-size: 1.6em; font-weight: bold;
            white-space: normal; word-break: break-word; color: #004cff;
        }
        .champion-row .team-score { display: none; }

        /* Total Points Box */
        .total-box {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background-color: #000; color: #fff; font-weight: bold;
            border-radius: 12px; width: 120px; height: 80px;
            margin: 4px auto 4px auto;
        }
        .total-box .total-val { font-size: 3em; line-height: 1.1; }

        /* STICKY HEADER */
        .sticky-header { position: sticky; top: 0; z-index: 999; background-color: #e3e7e8; }
        .sticky-header .container { max-width: 100%; width: 100%; padding-left: 10px; padding-right: 10px; padding-top: 4px; padding-bottom: 4px; }
        .sticky-divider { border: none; border-top: 2px solid #dee2e6; margin: 0; }

        /* Section divider between group and knockout */
        .section-divider {
            text-align: center; color: #86e5f0; font-size: 1.4em; font-weight: bold;
            margin: 24px 0 8px 0;
        }

        /* MOBILE */
        @media (max-width: 700px) {
            .container { max-width: 100%; padding: 4px 6px; }
            .match-grid { grid-template-columns: 1fr 75px 75px 75px; font-size: 0.8em; min-width: 0; }
            h1 { font-size: 1.4em; margin-top: 2px; margin-bottom: 2px; }
            h2 { font-size: 1.8em; margin-top: 24px; }
            h3 { font-size: 0.9em; }
            .total-box { width: 90px; height: 60px; margin: 0 auto; }
            .total-box .total-val { font-size: 2.2em; }

            /* Stacked matchup/score cells on mobile */
            .match-grid .cell-matchup,
            .match-grid .cell-pred,
            .match-grid .cell-act {
                display: flex; flex-direction: column; line-height: 1.5; width: 100%; min-width: 0;
            }
            .match-grid .cell-matchup { align-items: flex-start; }
            .match-grid .cell-pred,
            .match-grid .cell-act { align-items: center; }
            .match-grid .cell-matchup span,
            .match-grid .cell-pred span,
            .match-grid .cell-act span { display: block; }
            .match-grid .cell-matchup span:first-child::after,
            .match-grid .cell-pred span:first-child::after,
            .match-grid .cell-act span:first-child::after { content: ''; }

            .bracket-grid { grid-template-columns: 0.67fr 0.2fr 0.67fr; }
            .game-cell { font-size: 0.75em; padding: 3px 2px 3px 5px; }
            .game-cell.predicted { padding-left: 8px; padding-right: 16px; }
            .game-cell.actual    { padding-right: 16px; }
        }
    </style>
    <script>
      function fitTitle() {
        const h1 = document.getElementById('participantTitle');
        if (window.innerWidth > 700) return;
        let size = 28;
        h1.style.fontSize = size + 'px';
        while (h1.scrollWidth > h1.offsetWidth && size > 10) {
          size--;
          h1.style.fontSize = size + 'px';
        }
      }
      window.addEventListener('load', fitTitle);
      window.addEventListener('resize', fitTitle);
    </script>
    <script>
        fetch('../navbar.html')
            .then(r => r.text())
            .then(html => {
                document.getElementById('navbar').innerHTML = html;
            });
    </script>
</head>
<body>

<div class="sticky-header">
    <div id="navbar"></div>
    <div class="container">
        <h1 id="participantTitle">Loading...</h1>
        <div id="totalBox"></div>
    </div>
    <hr class="sticky-divider">
</div>

<div class="container">
    <div id="content"></div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const rawName = params.get('name') || "Participant";
    document.getElementById('participantTitle').innerText = `${rawName}'s TOTAL Points`;

    const formatGroup = (g) => g.replace('Group', 'Group ');
    const placeholder = (txt) => `<div class="placeholder-row" style="min-height:24px; margin:2px 4px; display:flex; align-items:center; justify-content:center; color:#aaa; font-size:0.85em;">${txt}</div>`;

    function renderTeam(name, score) {
        const hasName = name != null && name !== '';
        return `<div class="team-row">
            <span class="team-name">${hasName ? name : ''}</span>
            <span class="team-score">${hasName ? (score ?? '') : ''}</span>
        </div>`;
    }

    function buildRoundCard(title, games) {
        let html = `<div class="card knockout-card">
            <h3 class="knockout-title">${title}</h3>
            <div class="bracket-grid">
                <div class="bracket-header">Predicted</div>
                <div class="bracket-header">Pts</div>
                <div class="bracket-header">Actual</div>
                <div style="height:10px"></div><div style="height:10px"></div><div style="height:10px"></div>`;
        games.forEach((g, i) => {
            const hasPred = g.pred_home_name != null && g.pred_home_name !== '';
            
            let ptsCell = `<div class="pts-span pts-empty" style="grid-row: span 2"></div>`;
            if (hasPred) {
                if (g.pts_awarded === null || g.pts_awarded === undefined || g.pts_awarded === '') {
                    ptsCell = `<div class="pts-span pts-empty" style="grid-row: span 2"></div>`;
                } else {
                    const ptsClass = g.pts_awarded === 0 ? 'pts-zero' : 'pts-pos';
                    ptsCell = `<div class="pts-span ${ptsClass}" style="grid-row: span 2">${g.pts_awarded}</div>`;
                }
            }
            
            html += `
                <div class="game-cell predicted">${renderTeam(g.pred_home_name, g.pred_home_score)}</div>
                ${ptsCell}
                <div class="game-cell actual">${renderTeam(g.act_home_name, g.act_home_score)}</div>
                <div class="game-cell predicted">${renderTeam(g.pred_away_name, g.pred_away_score)}</div>
                <div class="game-cell actual">${renderTeam(g.act_away_name, g.act_away_score)}</div>`;
            if (i < games.length - 1) html += `<hr class="game-divider">`;
        });
        html += `</div></div>`;
        return html;
    }

    function buildChampionCard(title, game) {
        const hasPred = game.pred_home_name != null && String(game.pred_home_name).trim() !== '';
        
        let ptsCell = `<div class="pts-span pts-empty champion-pts" style="min-height:64px;"></div>`;
        if (hasPred) {
            if (game.pts_awarded === null || game.pts_awarded === undefined || game.pts_awarded === '') {
                ptsCell = `<div class="pts-span pts-empty champion-pts" style="min-height:64px;"></div>`;
            } else {
                const ptsClass = game.pts_awarded === 0 ? 'pts-zero' : 'pts-pos';
                ptsCell = `<div class="pts-span ${ptsClass} champion-pts" style="min-height:64px;">${game.pts_awarded}</div>`;
            }
        }
        
        return `<div class="card knockout-card">
            <h3 class="knockout-title">${title}</h3>
            <div class="bracket-grid">
                <div class="bracket-header">Predicted</div>
                <div class="bracket-header">Pts</div>
                <div class="bracket-header">Actual</div>
                <div style="height:10px"></div><div style="height:10px"></div><div style="height:10px"></div>
                <div class="game-cell predicted champion-row" style="min-height:64px;">${renderTeam(game.pred_home_name, '')}</div>
                ${ptsCell}
                <div class="game-cell actual champion-row" style="min-height:64px;">${renderTeam(game.act_home_name, '')}</div>
            </div>
        </div>`;
    }

    // Fetch both JSON files in parallel
    Promise.all([
        fetch('/json/group_pts.json').then(r => r.json()),
        fetch('/json/knockout_pts.json').then(r => r.json())
    ]).then(([groupData, knockoutData]) => {
        const gData = groupData[rawName];
        const kData = knockoutData[rawName] || {};

        // Calculate combined total
        const groupTotal   = gData?.total_points ?? 0;
        const knockoutTotal = kData?.total_points ?? 0;
        const combinedTotal = groupTotal + knockoutTotal;

        document.getElementById('totalBox').innerHTML = `
            <div class="total-box">
                <div class="total-val">${combinedTotal}</div>
            </div>`;

        if (!gData) {
            document.getElementById('content').innerHTML = `<p style="color:red">No data found for "${rawName}".</p>`;
            return;
        }

        let html = '<h2>Group Matches</h2>';

        // Group match cards
        for (const group in gData.matches) {
            html += `<div class="card"><h3>${formatGroup(group)}</h3>
                     <div class="match-grid header">
                        <span>Matchup</span><span>Predicted</span><span>Actual</span><span>Pts</span>
                     </div>`;
            gData.matches[group].forEach(m => {
                const homeName  = m.home_name  || '—';
                const awayName  = m.away_name  || '—';
                const homeScore = m.home_score != null ? m.home_score : '';
                const awayScore = m.away_score != null ? m.away_score : '';
                const actHome   = m.act_home_score != null ? m.act_home_score : '';
                const actAway   = m.act_away_score != null ? m.act_away_score : '';
                let mClass = m.pts_awarded == null ? "" : m.pts_awarded === 0 ? "pts-0" : m.pts_awarded === 1 ? "pts-1" : "pts-2";
                html += `<div class="match-grid">
                            <div class="cell-matchup">
                                <span>${homeName}</span>
                                <span>${awayName}</span>
                            </div>
                            <div class="cell-pred" style="text-align:center">
                                <span>${homeScore}</span>
                                <span>${awayScore}</span>
                            </div>
                            <div class="cell-act" style="font-weight:bold; color:#000; text-align:center">
                                <span>${actHome}</span>
                                <span>${actAway}</span>
                            </div>
                            <span class="${mClass}" style="text-align:center">${m.pts_awarded != null ? m.pts_awarded : ''}</span>
                         </div>`;
            });
            html += `</div>`;
        }

        // Group rank cards
        html += '<h2>Group Rank</h2>';
        for (const group in gData.rankings) {
            const rankingData = gData.rankings[group];
            const rawPts = rankingData.player_ranking.length > 0
                              ? rankingData.player_ranking[0].pts_awarded : null;
            const groupPoints = rawPts;

            let rankClass = '';
            let ptsDisplay = '';
            if (rawPts === null || rawPts === undefined || rawPts === '') {
                rankClass = '';
                ptsDisplay = '';
            } else if (rawPts === 0 || rawPts === '0') {
                rankClass = 'pts-low';
                ptsDisplay = 0;
            } else if (rawPts === 4 || rawPts === 5 || rawPts === '4' || rawPts === '5') {
                rankClass = 'pts-mid';
                ptsDisplay = rawPts;
            } else if (rawPts === 9 || rawPts === '9') {
                rankClass = 'pts-high';
                ptsDisplay = rawPts;
            }
            const playerRows = rankingData.player_ranking.map(r =>
                r.rank_name ? `<div class="rank-item">${r.rank_name}</div>` : placeholder('')
            ).join('');
            const actualRows = rankingData.actual_ranking.map(r =>
                r.rank_name ? `<div class="rank-item">${r.rank_name}</div>` : placeholder('')
            ).join('');
            html += `<div class="card"><h3 style="text-align:center">${formatGroup(group)}</h3>
                     <div class="rank-grid">
                        <div class="rank-header">Predicted</div>
                        <div class="rank-header">Pts</div>
                        <div class="rank-header">Actual Order</div>
                        <div class="rank-col rank-col-pred">${playerRows}</div>
                        <div class="pts-cell ${rankClass}">
                            <div class="pts-val">${ptsDisplay}</div>
                        </div>
                        <div class="rank-col">${actualRows}</div>
                     </div></div>`;
        }

        // Knockout cards
        html += '<h2>Knockout Stage</h2>';
        const rounds = [
            { key: 'round_of_32',   title: 'Round-of-32' },
            { key: 'round_of_16',   title: 'Round-of-16' },
            { key: 'quarterfinals', title: 'Quarter-finals' },
            { key: 'semifinals',    title: 'Semi-finals' },
            { key: 'finals',        title: 'Finals' },
            { key: 'champions',     title: 'CHAMPIONS' }
        ];
        rounds.forEach(r => {
            const games = kData[r.key] || [];
            if (games.length === 0) return;
            if (r.key === 'champions') {
                html += buildChampionCard(r.title, games[0]);
            } else {
                html += buildRoundCard(r.title, games);
            }
        });

        document.getElementById('content').innerHTML = html;
    }).catch(err => {
        document.getElementById('content').innerHTML = `<p style="color:red">Error loading data: ${err.message}</p>`;
    });
</script>

<div id="chatbot-placeholder"></div>
<script>
  fetch('/chatbot.html')
    .then(r => r.text())
    .then(html => {
      const placeholder = document.getElementById('chatbot-placeholder');
      // Inject the non-script HTML
      placeholder.innerHTML = html;
      // Re-execute any scripts manually
      placeholder.querySelectorAll('script').forEach(oldScript => {
        const newScript = document.createElement('script');
        newScript.textContent = oldScript.textContent;
        document.body.appendChild(newScript);
      });
    });
</script>
</body>
</html>
