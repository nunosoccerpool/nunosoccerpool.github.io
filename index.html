<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 World Cup Pool</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Verdana, Geneva, sans-serif;
    }

    /* iframe fills the entire viewport */
    #site-frame {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ── Audio Player — compact floating widget, bottom-left ── */
    #audio-bar {
      position: fixed;
      bottom: 14px;
      left: 14px;
      width: auto;
      height: auto;
      background: rgba(26, 26, 26, 0.92);
      border: 1px solid #FFD700;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      z-index: 9999;
      backdrop-filter: blur(6px);
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }

    #song-title {
      font-size: 0.65rem;
      color: #cccccc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100px;
    }

    #song-title span {
      font-size: 0.55rem;
      color: #FFD700;
      display: block;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 50%;
      transition: background 0.2s, color 0.2s;
      line-height: 1;
      flex-shrink: 0;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,0.12); }
    .ctrl-btn:active { background: rgba(255,255,255,0.22); }

    #btn-play-pause {
      font-size: 1.3rem;
      color: #FFD700;
    }

    /* Progress bar */
    #progress-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
      width: 70px;
    }
    #progress-bar-bg {
      width: 100%;
      height: 4px;
      background: #444;
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }
    #progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #FFD700;
      border-radius: 2px;
      pointer-events: none;
    }
    #time-display {
      font-size: 0.58rem;
      color: #888;
      text-align: right;
    }

    /* Volume */
    #vol-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    #vol-icon { font-size: 0.85rem; color: #aaa; }
    #vol-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 55px;
      height: 3px;
      background: #444;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    #vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #FFD700;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      #progress-wrap { max-width: 100px; }
      #vol-wrap { display: none; }
      .ctrl-btn { padding: 5px 6px; font-size: 1rem; }
      #btn-play-pause { font-size: 1.15rem; }
    }
  </style>
</head>
<body>

  <iframe id="site-frame" src="/standings.html"></iframe>

  <!-- ── Audio Player Bar ── -->
  <div id="audio-bar">

    <button class="ctrl-btn" id="btn-prev" title="Previous">⏮</button>
    <button class="ctrl-btn" id="btn-play-pause" title="Play/Pause">▶</button>
    <button class="ctrl-btn" id="btn-stop" title="Stop">⏹</button>
    <button class="ctrl-btn" id="btn-next" title="Next">⏭</button>

    <div id="song-title">
      <span>Now Playing</span>
      <span id="song-name">—</span>
    </div>

    <div id="progress-wrap">
      <div id="progress-bar-bg">
        <div id="progress-bar-fill"></div>
      </div>
      <div id="time-display">0:00 / 0:00</div>
    </div>

    <div id="vol-wrap">
      <span id="vol-icon">🔊</span>
      <input type="range" id="vol-slider" min="0" max="1" step="0.02" value="0.4" />
    </div>

  </div>

  <audio id="player"></audio>

  <script>
    const SONGS = [
      { file: '/songs/Track1.mp3', label: 'Track 1' },
      { file: '/songs/Track2.mp3', label: 'Track 2' },
      { file: '/songs/Track3.mp3', label: 'Track 3' },
      { file: '/songs/Track4.mp3', label: 'Track 4' },
	  { file: '/songs/Track5.mp3', label: 'Track 5' },
	  { file: '/songs/Track6.mp3', label: 'Track 6' },
    ];

    const audio       = document.getElementById('player');
    const btnPlay     = document.getElementById('btn-play-pause');
    const btnStop     = document.getElementById('btn-stop');
    const btnPrev     = document.getElementById('btn-prev');
    const btnNext     = document.getElementById('btn-next');
    const songName    = document.getElementById('song-name');
    const fill        = document.getElementById('progress-bar-fill');
    const timeLbl     = document.getElementById('time-display');
    const progressBg  = document.getElementById('progress-bar-bg');
    const volSlider   = document.getElementById('vol-slider');

    let currentIdx = 0;
    let started    = false;   // true once the user has clicked "Proceed"

    function fmt(s) {
      const m = Math.floor(s / 60);
      const ss = Math.floor(s % 60).toString().padStart(2, '0');
      return `${m}:${ss}`;
    }

    function loadSong(idx, autoplay) {
      currentIdx = ((idx % SONGS.length) + SONGS.length) % SONGS.length;
      audio.src = SONGS[currentIdx].file;
      songName.textContent = SONGS[currentIdx].label;
      audio.volume = parseFloat(volSlider.value);
      fill.style.width = '0%';
      timeLbl.textContent = '0:00 / 0:00';
      if (autoplay) {
        audio.play().catch(() => {});
      }
    }

    function updatePlayBtn() {
      btnPlay.textContent = audio.paused ? '▶' : '⏸';
    }

    // Auto-advance to next song
    audio.addEventListener('ended', () => loadSong(currentIdx + 1, true));

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      fill.style.width = pct + '%';
      timeLbl.textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;
    });

    audio.addEventListener('play',  updatePlayBtn);
    audio.addEventListener('pause', updatePlayBtn);

    // Controls
    btnPlay.addEventListener('click', () => {
      if (!started) return;  // no music until "Proceed" clicked
      if (audio.paused) {
        audio.play().catch(() => {});
      } else {
        audio.pause();
      }
    });

    btnStop.addEventListener('click', () => {
      audio.pause();
      audio.currentTime = 0;
      updatePlayBtn();
    });

    btnPrev.addEventListener('click', () => {
      if (!started) return;
      // If more than 3 seconds in, restart current song; otherwise go back
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
      } else {
        loadSong(currentIdx - 1, !audio.paused);
      }
    });

    btnNext.addEventListener('click', () => {
      if (!started) return;
      loadSong(currentIdx + 1, !audio.paused);
    });

    // Seek on click
    progressBg.addEventListener('click', (e) => {
      if (!audio.duration) return;
      const rect = progressBg.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pct * audio.duration;
    });

    // Volume
    volSlider.addEventListener('input', () => {
      audio.volume = parseFloat(volSlider.value);
    });

    // ── Listen for "Proceed to Standings" message from the iframe ──
    window.addEventListener('message', (e) => {
      if (e.data === 'startMusic' && !started) {
        started = true;
        loadSong(0, true);
      }
    });

    // Auto-resume if user already passed the overlay in a previous load
    if (sessionStorage.getItem('overlayShown')) {
      started = true;
      loadSong(0, true);
    }

    // Pre-load first song title without playing
    songName.textContent = SONGS[0].label;
  </script>

</body>
</html>
