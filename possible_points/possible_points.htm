<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Possible Points Left</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        /* Global Font: Verdana & Darkened Stadium Background */
        body { 
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('/images/index-stadium.jpg') no-repeat center center fixed; 
            background-size: cover;
            font-family: Verdana, Geneva, sans-serif; 
            margin: 0; 
        }

        /* Desktop Block / Mobile-Only Restriction */
        .desktop-restriction-notice {
            display: block;
            text-align: center;
            color: #ffffff;
            margin: 100px auto;
            max-width: 80%;
            font-size: 1.5rem;
            background-color: rgba(0, 0, 0, 0.75);
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #3a5a40;
        }
        .header-full-width, .master-table-container {
            display: none !important;
        }

        /* Titles */
        .header-full-width { 
            background-color: rgba(255, 255, 255, 0.85); 
            width: 100%; 
            padding: 15px 0 10px 0; 
            text-align: center; 
            margin: 0; 
        }
        .standings-title { font-size: 3rem; color: #3a5a40; text-transform: uppercase; letter-spacing: 4px; font-weight: bold; margin: 0; line-height: 1; }
        .last-updated { font-size: 0.9rem; color: #888; margin-top: 10px; }

        /* Table Container */
        .master-table-container {
            margin: 40px auto;
            max-width: fit-content;
            background-color: #ffffff;
            border: 2px solid #3a5a40; 
            border-radius: 15px;      
            box-shadow: 0 15px 60px 10px rgba(0, 0, 0, 0.7); 
            padding: 50px; 
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
        }

        .table-wrapper { display: flex; flex-direction: column; }

        .table { 
            border-collapse: separate; 
            border-spacing: 0; 
            margin-bottom: 0;
            width: auto !important;
            table-layout: fixed;
            font-family: Verdana, Geneva, sans-serif !important;
        }

        .table td { 
            vertical-align: middle; 
            text-align: center; 
            border: 0.5px solid #dee2e6; 
            padding: 2px 6px !important; 
            height: 36px; 
            font-size: 16px !important; 
        }

        tbody td.col-rank, tbody td.col-total { font-size: 18px !important; line-height: 1.1 !important; font-weight: bold !important; }
        tbody td.col-participant { font-size: 24px !important; line-height: 1.1 !important; }

        .table td.col-participant { font-weight: normal !important; text-align: left !important; white-space: nowrap; }
        
        thead th { 
            height: 85px !important; 
            border: 0.5px solid #dee2e6; 
            font-size: 18px !important;
            position: sticky;
            top: 64px;
            z-index: 10;
            background-color: #ffffff; 
        }

        /* Flex centering to guarantee absolute vertical/horizontal alignment of multiline text */
        .th-flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            text-align: center;
        }

        .header-caps { text-transform: uppercase; font-weight: bold !important; color: #000000; }
        .header-grey { background-color: #E5E5E5 !important; }
        
        /* Column Widths */
        .col-rank { width: 80px !important; }
        .col-participant { width: 250px !important; }
        .col-total { width: 160px !important; }

        .table a { text-decoration: none; color: #000000; }
        .table a:hover { text-decoration: underline; }

        .bg-top-five { background-color: #CCFFCC !important; }
        .bg-standard { background-color: #F2F2F2 !important; } 

        .stack-header { display: inline-block; line-height: 1.2; white-space: nowrap; }
        
        /* --- MOBILE ONLY VIEWS (& ALTERATIONS) --- */
        @media (max-width: 768px) {
            /* Hide the desktop notice on mobile */
            .desktop-restriction-notice { display: none !important; }

            /* Unhide core content modules on mobile viewports */
            .header-full-width { display: block !important; }
            .master-table-container { display: block !important; }

            /* Smaller font layout config for mobile title */
            .standings-title { font-size: 1.8rem; letter-spacing: 1px; }
            .last-updated { font-size: 0.72rem; } 
            
            /* Hide desktop table layouts completely */
            .master-table-container .table-wrapper { display: none !important; }
            
            /* Build alternative setup fluid container layout */
            .master-table-container {
                margin: 10px auto;
                width: 98% !important;
                max-width: 600px !important;
                padding: 10px !important;
                border-radius: 8px;
                box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
                overflow-x: hidden !important;
            }

            /* Unhide mobile wrapper frame */
            .mobile-table-wrapper {
                display: block !important;
                width: 100% !important;
                max-height: 75vh;
                overflow-y: auto;
            }

            /* Fluid table behavior targeting 100% workspace layout */
            .table-mobile-combined {
                width: 100% !important;
                table-layout: fixed !important;
            }

            /* Exact sizing match to bonus_questions.htm data rows */
            .table-mobile-combined thead th, 
            .table-mobile-combined tbody td {
                padding: 6px 4px !important;
                height: 38px !important;
                font-size: 15px !important;
                word-wrap: break-word;
            }

            /* Fluid column tracking adjustments */
            .table-mobile-combined .col-rank { width: 18% !important; font-size: 15px !important; }
            .table-mobile-combined .col-participant { width: 50% !important; text-overflow: ellipsis; overflow: hidden; }
            .table-mobile-combined .col-total { width: 32% !important; font-size: 15px !important; }

            /* Mobile font sizing matching bonus_questions.htm links */
            .table-mobile-combined tbody td.col-participant {
                font-size: 19px !important;
            }

            .table-mobile-combined thead th {
                height: 50px !important;
                position: sticky;
                top: 0;
                z-index: 10;
                background-color: #ffffff;
            }
        }
        
        /* Default state hides mobile container wrapper frames on Desktop layouts */
        .mobile-table-wrapper { display: none; }

        .navbar {
            position: fixed !important;
            top: 0 !important;
            width: 100% !important;
            z-index: 9999 !important;
        }
        body { padding-top: 64px; }
    </style>
    <script>
        fetch('/navbar.html')
            .then(r => r.text())
            .then(html => {
                const styleMatch = html.match(/<style>([\s\S]*?)<\/style>/i);
                if (styleMatch) {
                    const style = document.createElement('style');
                    style.textContent = styleMatch[1];
                    document.head.appendChild(style);
                }
                document.getElementById('navbar-placeholder').innerHTML = html.replace(/<style>[\s\S]*?<\/style>/i, '').replace(/<script[\s\S]*?<\/script>/gi, '');
                const scriptMatch = html.match(/<script>([\s\S]*?)<\/script>/i);
                if (scriptMatch) {
                    const s = document.createElement('script');
                    s.textContent = scriptMatch[1];
                    document.body.appendChild(s);
                }
            });
    </script>
</head>
<body>

<div id="navbar-placeholder"></div>

<div class="desktop-restriction-notice">
    <h4>Mobile View Required</h4>
    <p>This layout is optimized exclusively for mobile screens. Please view this link from a phone or narrow your browser window.</p>
</div>

<div class="header-full-width">
    <h2 class="standings-title">Possible Points</h2>
    <div class="last-updated" id="update-timestamp">Loading...</div>
</div>

<div class="master-table-container">
    <div class="table-wrapper">
        <table class="table table-sm" id="stats-table">
            <thead>
                <tr>
                    <th class="col-rank header-grey header-caps"><div class="th-flex-center"><span class="stack-header">RANK</span></div></th>
                    <th class="col-participant header-grey header-caps"><div class="th-flex-center"><span class="stack-header">PARTICIPANT</span></div></th>
                    <th class="col-total header-grey header-caps"><div class="th-flex-center"><span class="stack-header">POSSIBLE<br>PTS LEFT</span></div></th>
                </tr>
            </thead>
            <tbody id="stats-body"></tbody>
        </table>
    </div>

    <div class="mobile-table-wrapper">
        <table class="table table-sm table-mobile-combined" id="mobile-combined-table">
            <thead>
                <tr>
                    <th class="col-rank header-grey header-caps"><div class="th-flex-center"><span class="stack-header">RANK</span></div></th>
                    <th class="col-participant header-grey header-caps"><div class="th-flex-center"><span class="stack-header">PARTICIPANT</span></div></th>
                    <th class="col-total header-grey header-caps"><div class="th-flex-center"><span class="stack-header">POSSIBLE<br>PTS LEFT</span></div></th>
                </tr>
            </thead>
            <tbody id="mobile-combined-body"></tbody>
        </table>
    </div>
</div>

<script>
    function formatDate(isoString) {
        const date = new Date(isoString);
        const options = { month: 'long', day: 'numeric', year: 'numeric' };
        const datePart = date.toLocaleDateString('en-US', options);
        let hours = date.getHours();
        const minutes = date.getMinutes().toString().padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        return `${datePart} @ ${hours}:${minutes} ${ampm}`;
    }

    async function loadStandings() {
        try {
            const response = await fetch('/json/index.json');
            const data = await response.json();
            document.getElementById('update-timestamp').innerHTML = `<b>Last updated on:</b> <i>${formatDate(data.metadata.last_updated)}</i>`;

            const statsBody = document.getElementById('stats-body');
            const mobileBody = document.getElementById('mobile-combined-body');

            // Render matching the exact ordered layout array from data standings object
            data.standings.forEach((row, index) => {
                const isTopFive = index < 5;
                const mainRowClass = isTopFive ? 'bg-top-five' : 'bg-standard';
                
                const getColorStyle = (hexColor) => hexColor ? `style="color: ${hexColor} !important;"` : '';
                
                // Only Column 3 contains active target participant path references
                const renderLink = (val, hexColor, name) => {
                    if (val === "" || val == null) return "";
                    const styleAttr = hexColor ? `style="color: ${hexColor} !important; font-weight: bold;"` : 'style="font-weight: bold;"';
                    return `<a href="/possible_pts/possible_pts.htm?name=${encodeURIComponent(name)}" ${styleAttr}>${val}</a>`;
                };

                // --- Generate Standard Desktop Rows ---
                const trStats = document.createElement('tr');
                trStats.innerHTML = `
                    <td class="col-rank ${mainRowClass}" ${getColorStyle(row.rank_color)}>${row.rank}</td>
                    <td class="col-participant ${mainRowClass}" ${getColorStyle(row.participant_color)}>${row.participant}</td>
                    <td class="col-total ${mainRowClass}">${renderLink(row.possible_left, row.possible_left_color, row.participant)}</td>
                `;
                statsBody.appendChild(trStats);

                // --- Generate Mobile Unified Fluid Single Rows ---
                const trMobile = document.createElement('tr');
                trMobile.innerHTML = `
                    <td class="col-rank ${mainRowClass}" ${getColorStyle(row.rank_color)}>${row.rank}</td>
                    <td class="col-participant ${mainRowClass}" ${getColorStyle(row.participant_color)}>${row.participant}</td>
                    <td class="col-total ${mainRowClass}">${renderLink(row.possible_left, row.possible_left_color, row.participant)}</td>
                `;
                mobileBody.appendChild(trMobile);
            });
        } catch (e) { console.error("Load Error:", e); }
    }
    loadStandings();
</script>

<div id="chatbot-placeholder"></div>
<script>
  fetch('/chatbot.html')
    .then(r => r.text())
    .then(html => {
      const placeholder = document.getElementById('chatbot-placeholder');
      // Inject the non-script HTML
      placeholder.innerHTML = html;
      // Re-execute any scripts manually
      placeholder.querySelectorAll('script').forEach(oldScript => {
        const newScript = document.createElement('script');
        newScript.textContent = oldScript.textContent;
        document.body.appendChild(newScript);
      });
    });
</script>
</body>
</html>
