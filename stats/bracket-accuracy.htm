<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bracket Accuracy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        /* Base styles */
        body {
            margin: 0;
            padding: 0;
            font-family: Verdana, Geneva, sans-serif; 
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('/images/ball-stats.png') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            min-height: 100vh;
			scrollbar-gutter: stable;
        }

        /* CONTENT LAYOUT */
        .content-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 10px;
        }

        .container-glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            width: fit-content; 
            max-width: 95%;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 30px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #C8E6C9;
            font-weight: bold;
        }

        /* Table Styling */
        .custom-table {
            width: 440px; 
            margin-bottom: 25px; 
            border-collapse: separate;
            border-spacing: 0 4px;
            color: #ffffff;
            table-layout: fixed; 
        }

        .narrow-table {
            width: 240px; 
            margin-bottom: 25px;
        }

        .span-header {
            background: rgba(245, 245, 220, 0.15) !important; 
            color: #F5F5DC !important;
            padding: 12px !important;
            text-align: center;
            border: 1px solid rgba(245, 245, 220, 0.3) !important;
            border-radius: 10px;
            font-size: 0.95rem;
        }

        .custom-table td {
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 12px; 
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle;
            line-height: 1.2;
            height: 38px; 
        }

        .col-left { border-radius: 8px 0 0 8px; border-left: 4px solid #F5F5DC; text-align: left; }
        .col-right { border-radius: 0 8px 8px 0; text-align: right; width: 75px; }
        .col-full { border-radius: 8px; border-left: 4px solid #F5F5DC; text-align: left; }

		@media (max-width: 991px) {
			h1 { font-size: 1.8rem; margin-bottom: 15px; }
			.content-wrapper { padding: 20px 5px; }
			.container-glass { padding: 15px; width: 100%; }
            
            .custom-table { 
                width: 100%; 
                table-layout: auto; 
                margin-bottom: 24px !important; 
            }
            .narrow-table { 
                width: 100%; 
                table-layout: auto; 
                margin-bottom: 24px !important; 
            }
            
			.span-header { 
                white-space: normal;
                font-size: 0.85rem;
                padding: 8px !important;
			}
            .custom-table td {
                white-space: normal !important;
                word-break: break-word;
                height: auto;
            }
		}
    </style>
    <div id="navbar-placeholder"></div>
    <script>
        fetch('/navbar.html')
            .then(r => r.text())
            .then(html => {
                document.getElementById('navbar-placeholder').innerHTML = html;
            });
    </script>
</head>
<body>

<div class="content-wrapper">
    <div class="container-glass">
        <h1>BRACKET ACCURACY</h1>

        <div class="row row-cols-1 row-cols-lg-auto gx-5 gy-0 justify-content-center">
            <div class="col-auto">
                <table class="custom-table">
                    <thead><tr><th id="title1" class="span-header">Loading Matchup Stats...</th></tr></thead>
                    <tbody id="body1"></tbody>
                </table>

                <table class="custom-table">
                    <thead><tr><th id="title2" class="span-header">Loading Matchup Stats...</th></tr></thead>
                    <tbody id="body2"></tbody>
                </table>

                <table class="custom-table">
                    <thead><tr><th id="title3" class="span-header">Loading Matchup Stats...</th></tr></thead>
                    <tbody id="body3"></tbody>
                </table>
            </div>

            <div class="col-auto">
                <table class="custom-table narrow-table">
                    <thead><tr><th colspan="2" id="title4" class="span-header">Loading Prediction Stats...</th></tr></thead>
                    <tbody id="body4"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    async function loadStats() {
        try {
            const response = await fetch('/json/bracket-accuracy.json');
            const data = await response.json();

            // Populate Table Titles
            document.getElementById('title1').textContent = data.table1.title;
            document.getElementById('title2').textContent = data.table2.title;
            document.getElementById('title3').textContent = data.table3.title;
            document.getElementById('title4').textContent = data.table4.title;

            // Render single-column structural tables (Tables 1-3)
            ['table1', 'table2', 'table3'].forEach((tableKey, index) => {
                const bodyElement = document.getElementById(`body${index + 1}`);
                bodyElement.innerHTML = ''; 
                
                data[tableKey].rows.forEach(row => {
                    const content = row.col1 === "" ? "&nbsp;" : row.col1;
                    bodyElement.innerHTML += `<tr><td class="col-full">${content}</td></tr>`;
                });
            });

            // Render dual-column structural table (Table 4)
            const body4 = document.getElementById('body4');
            body4.innerHTML = '';
            if (data.table4.rows.length === 0) {
                body4.innerHTML = `<tr><td colspan="2" class="col-full text-muted text-center">No data available yet</td></tr>`;
            } else {
                data.table4.rows.forEach(row => {
                    body4.innerHTML += `
                        <tr>
                            <td class="col-left">${row.col1 === "" ? "&nbsp;" : row.col1}</td>
                            <td class="col-right">${row.col2 === "" ? "&nbsp;" : row.col2}</td>
                        </tr>`;
                });
            }

        } catch (error) {
            console.error("Error running front-end structural ingestion logic:", error);
        }
    }
    window.onload = loadStats;
</script>

<div id="chatbot-placeholder"></div>
<script>
  fetch('/chatbot.html')
    .then(r => r.text())
    .then(html => {
      const placeholder = document.getElementById('chatbot-placeholder');
      // Inject the non-script HTML
      placeholder.innerHTML = html;
      // Re-execute any scripts manually
      placeholder.querySelectorAll('script').forEach(oldScript => {
        const newScript = document.createElement('script');
        newScript.textContent = oldScript.textContent;
        document.body.appendChild(newScript);
      });
    });
</script>
</body>
</html>
