<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Matches Accuracy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        /* Base styles */
        body {
            margin: 0;
            padding: 0;
            font-family: Verdana, Geneva, sans-serif; 
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('/images/ball-stats.png') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            min-height: 100vh;
			scrollbar-gutter: stable;
        }

        /* CONTENT LAYOUT */
        .content-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 10px;
        }

        .container-glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            width: fit-content; 
            margin: 0 auto;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 30px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #C8E6C9;
            font-weight: bold;
        }

        /* Tables wrapper */
        .tables-wrapper {
            display: flex;
            justify-content: center;
            gap: 80px;
        }

        /* Table Styling */
        .custom-table {
            width: auto; 
            margin-bottom: 30px; 
            border-collapse: separate;
            border-spacing: 0 4px;
            color: #ffffff;
            table-layout: fixed; 
        }

        .span-header {
            background: rgba(245, 245, 220, 0.15) !important; 
            color: #F5F5DC !important;
            padding: 15px !important;
            text-align: center;
            border: 1px solid rgba(245, 245, 220, 0.3) !important;
            border-radius: 10px;
            font-size: 1rem;
        }

        .custom-table td {
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 5px; 
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .col-1 { width: 100px; border-radius: 8px 0 0 8px; border-left: 4px solid #F5F5DC; padding-left: 15px !important; }
        .col-2 { width: 65px; text-align: right; padding-right: 2px !important; }
        .col-3 { width: 55px; border-radius: 0 8px 8px 0; text-align: left; padding-left: 8px !important; }

		/* Arrow navigation — hidden on desktop */
		.table-nav { display: none; }

		@media (max-width: 991px) {
			h1 { font-size: 1.3rem; margin-bottom: 15px; }
			.col-1 { width: 190px !important; }
			.col-2 { width: 50px !important; }
			.col-3 { width: 20px !important; }
			.col-2 { text-align: right !important; }
			.col-3 { text-align: center !important; }
			.content-wrapper { padding: 30px 10px; }
			.container-glass { padding: 10px; width: fit-content; max-width: 95%; }
			.custom-table { width: 260px !important; }

			.span-header { 
			white-space: normal;
			font-size: 0.9rem;
			padding: 8px !important;
			}

			.tables-wrapper {
				gap: 0;
				justify-content: center;
			}

			.custom-table {
				display: none;
			}

			.custom-table.active {
				display: table;
			}

			.table-nav {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 15px;
			}

			.table-nav-btn {
				background: rgba(255,255,255,0.15);
				border: 1px solid rgba(255,255,255,0.3);
				color: #ffffff;
				padding: 8px 16px;
				border-radius: 20px;
				cursor: pointer;
				font-size: 0.85rem;
			}

			.table-nav-label {
				font-size: 0.9rem;
				color: #F5F5DC;
				font-weight: bold;
				text-transform: uppercase;
			}
		}
    </style>
    <div id="navbar-placeholder"></div>
    <script>
        fetch('/navbar.html')
            .then(r => r.text())
            .then(html => {
                document.getElementById('navbar-placeholder').innerHTML = html;
            });
    </script>
</head>
<body>

<div class="content-wrapper">
    <div class="container-glass">
        <h1>GROUP MATCHES ACCURACY</h1>

        <!-- Arrow navigation (mobile only) -->
        <div class="table-nav">
            <button class="table-nav-btn" onclick="prevTable()">&#8592; Prev</button>
            <span class="table-nav-label" id="table-nav-label">Outcome</span>
            <button class="table-nav-btn" onclick="nextTable()">Next &#8594;</button>
        </div>

        <div class="tables-wrapper">
            <table class="custom-table active">
                <thead>
                    <tr><th colspan="3" id="title1" class="span-header">Loading...</th></tr>
                </thead>
                <tbody id="body1"></tbody>
            </table>

            <table class="custom-table">
                <thead>
                    <tr><th colspan="3" id="title2" class="span-header">Loading...</th></tr>
                </thead>
                <tbody id="body2"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    async function loadStats() {
        try {
            const response = await fetch('/json/group-matches-accuracy.json');
            const data = await response.json();

            document.getElementById('title1').innerHTML = data.table1.title.replace(/outcome/i, '<b>OUTCOME</b>');
            document.getElementById('title2').innerHTML = data.table2.title.replace(/exact score/i, '<b>EXACT SCORE</b>');

            const populate = (id, rows) => {
                const body = document.getElementById(id);
                const paddedRows = [...rows];
                while (paddedRows.length < 100) paddedRows.push({ col1: '', col2: '', col3: '' });
                paddedRows.forEach(row => {
                    const c1 = row.col1 === "" || row.col1 == null ? "&nbsp;" : row.col1;
                    const c2 = row.col2 === "" || row.col2 == null ? "&nbsp;" : row.col2;
                    const c3 = row.col3 === "" || row.col3 == null ? "&nbsp;" : row.col3;
                    body.innerHTML += `
                        <tr>
                            <td class="col-1">${c1}</td>
                            <td class="col-2">${c2}</td>
                            <td class="col-3">${c3}</td>
                        </tr>`;
                });
            };

            populate('body1', data.table1.rows);
            populate('body2', data.table2.rows);

        } catch (error) {
            console.error("Error loading JSON data:", error);
        }
    }
    window.onload = loadStats;

    const tableLabels = ['Outcome', 'Exact Score'];
    let currentTable = 0;

    function showTable(index) {
        document.querySelectorAll('.custom-table').forEach((t, i) => {
            t.classList.toggle('active', i === index);
        });
        const label = document.getElementById('table-nav-label');
        if (label) label.textContent = tableLabels[index];
    }

    function prevTable() {
        currentTable = (currentTable - 1 + tableLabels.length) % tableLabels.length;
        showTable(currentTable);
    }

    function nextTable() {
        currentTable = (currentTable + 1) % tableLabels.length;
        showTable(currentTable);
    }
</script>

<div id="chatbot-placeholder"></div>
<script>
  fetch('/chatbot.html')
    .then(r => r.text())
    .then(html => {
      const placeholder = document.getElementById('chatbot-placeholder');
      // Inject the non-script HTML
      placeholder.innerHTML = html;
      // Re-execute any scripts manually
      placeholder.querySelectorAll('script').forEach(oldScript => {
        const newScript = document.createElement('script');
        newScript.textContent = oldScript.textContent;
        document.body.appendChild(newScript);
      });
    });
</script>
</body>
</html>
