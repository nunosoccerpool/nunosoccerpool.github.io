<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bracket Points</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
    <style>
        html { width: 100%; }
        *, *::before, *::after { box-sizing: border-box; }
        body { 
            font-family: Verdana, Geneva, sans-serif; \
            margin: 0; padding: 0; width: 100%;
            background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url('/images/grass.png') center center fixed;
            background-size: cover;
        }
        .container { max-width: 520px; margin: auto; padding: 20px; }
        .card {
            background: white; border: 1px solid #ccc; margin-bottom: 16px;
            padding: 12px 16px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.35);
        }
        h1 { text-align: center; color: #2c3e50; white-space: nowrap; margin-top: 4px; margin-bottom: 4px; font-size: 2em; }
        h2 { text-align: center; color: #2c3e50; margin-top: 40px; margin-bottom: 20px; }
        h3 { text-align: center; color: #555; margin-top: 0; font-size: 1.2em; }

        .total-box {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background-color: #000; color: #fff; font-weight: bold;
            border-radius: 12px; width: 120px; height: 80px;
            margin: 4px auto 4px auto;
        }
        .total-box .total-val { font-size: 3em; line-height: 1.1; }

        /* BRACKET GRID */
        .bracket-grid {
            display: grid;
            grid-template-columns: 0.67fr 70px 0.67fr;
            gap: 0;
            align-items: stretch;
        }
        .bracket-header {
            font-weight: bold; background: #e9ecef;
            padding: 6px 8px; border-radius: 4px;
            text-align: center; font-size: 1em;
        }
        .game-cell { padding: 4px 2px 4px 8px; font-size: 1em; }
        .game-cell.predicted { padding-left: 16px; padding-right: 32px; }
        .game-cell.actual    { padding-right: 18px; }
        
        /* Justification logic: Name right, Score left */
        .team-row { display: flex; align-items: center; }
        .team-name { flex: 1; text-align: right; padding-right: 8px; }
        .team-score { width: 25px; text-align: left; font-weight: bold; }
        
        /* Font color changes aligned with total_pts.htm */
        .game-cell.predicted .team-score { color: #004cff; }
        .game-cell.actual .team-score { color: #000000; }
        
		.pts-span {
			display: flex; align-items: center; justify-content: center;
			font-size: 1.6em; font-weight: bold;
			border-radius: 3px;
			min-height: 56px;
		}
        .pts-zero  { background-color: #FFC7CE; color: #EA002D; }
        .pts-pos   { background-color: #C6EFCE; color: #006100; }
        .pts-empty { background-color: #e9ecef; color: #6c757d; }

        .game-divider { grid-column: 1 / -1; border: none; margin: 10px 0; }
        .sticky-header { position: sticky; top: 0; z-index: 999; background-color: #e3e7e8; }
        .sticky-header .container { max-width: 100%; width: 100%; padding-left: 10px; padding-right: 10px; padding-top: 4px; padding-bottom: 4px; }
        .sticky-divider { border: none; border-top: 2px solid #dee2e6; margin: 0; }

        .champion-pts {
            min-height: 96px;
            font-size: 1.8em;
        }
        
        .champion-row {
            display: flex;
            align-items: center;      /* vertical centering */
            justify-content: center;  /* horizontal centering */
            padding-left: 0 !important;
            padding-right: 0 !important;
        }

        .champion-row .team-row {
            width: 100%;
            justify-content: center;
            align-items: center;
        }

        .champion-row .team-name {
            flex: 0 0 auto;
            text-align: center;
            padding-right: 0;
            text-transform: uppercase;
            font-size: 1.6em;
            font-weight: bold;
            white-space: normal; word-break: break-word;
            color: #004cff;
        }

        .champion-row .team-score {
            display: none;
        }

        @media (max-width: 700px) {
            .container { width: 100%; max-width: 100%; padding: 4px 6px; box-sizing: border-box; }

            .bracket-grid { grid-template-columns: 0.67fr 0.2fr 0.67fr; }
            .game-cell { font-size: 0.75em; padding: 3px 2px 3px 5px; }
            .game-cell.predicted { padding-left: 8px; padding-right: 16px; }
            .game-cell.actual    { padding-right: 16px; }
            h1 { font-size: 1.4em; margin-top: 2px; margin-bottom: 2px; } 
            h2 { font-size: 1em; margin-top: 24px; }
            h3 { font-size: 0.9em; }
            .total-box { width: 90px; height: 60px; margin: 0 auto; }
            .total-box .total-val { font-size: 2.2em; }
        }
    </style>
    <script>
      function fitTitle() {
        const h1 = document.getElementById('participantTitle');
        if (window.innerWidth > 700) return;
        let size = 28;
        h1.style.fontSize = size + 'px';
        while (h1.scrollWidth > h1.offsetWidth && size > 10) {
          size--;
          h1.style.fontSize = size + 'px';
        }
      }
      window.addEventListener('load', fitTitle);
      window.addEventListener('resize', fitTitle);
    </script>    
    <script>
        fetch('../navbar.html')
            .then(r => r.text())
            .then(html => {
                document.getElementById('navbar').innerHTML = html;
            });
    </script>
</head>
<body>

<div class="sticky-header">
    <div id="navbar"></div>
    <div class="container">
        <h1 id="participantTitle">Loading...</h1>
        <div id="totalBox"></div>
    </div>
    <hr class="sticky-divider">
</div>

<div class="container">
    <div id="content"></div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const rawName = params.get('name') || "Participant";
    const displayName = rawName;
    document.getElementById('participantTitle').innerText = `${displayName}'s KNOCKOUT STAGE Points`;

    function renderTeam(name, score) {
        const hasName = name != null && name !== '';
        return `
            <div class="team-row">
                <span class="team-name">${hasName ? name : ''}</span>
                <span class="team-score">${hasName ? (score ?? '') : ''}</span>
            </div>`;
    }

    function buildRoundCard(title, games) {
        let html = `<div class="card">
            <h3>${title}</h3>
            <div class="bracket-grid">
                <div class="bracket-header">Predicted</div>
                <div class="bracket-header">Pts</div>
                <div class="bracket-header">Actual</div>
                <div style="height:10px"></div><div style="height:10px"></div><div style="height:10px"></div>`;

        games.forEach((g, i) => {
            const hasPred = g.pred_home_name != null && String(g.pred_home_name).trim() !== '';
            
            let ptsCell = `<div class="pts-span pts-empty" style="grid-row: span 2"></div>`;
            if (hasPred) {
                if (g.pts_awarded === null || g.pts_awarded === undefined || g.pts_awarded === '') {
                    ptsCell = `<div class="pts-span pts-empty" style="grid-row: span 2"></div>`;
                } else {
                    const ptsClass = g.pts_awarded === 0 ? 'pts-zero' : 'pts-pos';
                    ptsCell = `<div class="pts-span ${ptsClass}" style="grid-row: span 2">${g.pts_awarded}</div>`;
                }
            }

            html += `
                <div class="game-cell predicted">${renderTeam(g.pred_home_name, g.pred_home_score)}</div>
                ${ptsCell}
                <div class="game-cell actual">${renderTeam(g.act_home_name, g.act_home_score)}</div>
                <div class="game-cell predicted">${renderTeam(g.pred_away_name, g.pred_away_score)}</div>
                <div class="game-cell actual">${renderTeam(g.act_away_name, g.act_away_score)}</div>`;

            if (i < games.length - 1) {
                html += `<hr class="game-divider">`;
            }
        });

        html += `</div></div>`;
        return html;
    }

    function buildChampionCard(title, game) {
        const hasPred = game.pred_home_name != null && String(game.pred_home_name).trim() !== '';
        
        let ptsCell = `<div class="pts-span pts-empty champion-pts" style="min-height:64px;"></div>`;
        if (hasPred) {
            if (game.pts_awarded === null || game.pts_awarded === undefined || game.pts_awarded === '') {
                ptsCell = `<div class="pts-span pts-empty champion-pts" style="min-height:64px;"></div>`;
            } else {
                const ptsClass = game.pts_awarded === 0 ? 'pts-zero' : 'pts-pos';
                ptsCell = `<div class="pts-span ${ptsClass} champion-pts" style="min-height:64px;">${game.pts_awarded}</div>`;
            }
        }

        return `
            <div class="card">
                <h3>${title}</h3>

                <div class="bracket-grid">
                    <div class="bracket-header">Predicted</div>
                    <div class="bracket-header">Pts</div>
                    <div class="bracket-header">Actual</div>

                    <div style="height:10px"></div>
                    <div style="height:10px"></div>
                    <div style="height:10px"></div>

                    <div class="game-cell predicted champion-row"
                         style="min-height:64px;">
                        ${renderTeam(game.pred_home_name, '')}
                    </div>

                    ${ptsCell}

                    <div class="game-cell actual champion-row"
                         style="min-height:64px;">
                        ${renderTeam(game.act_home_name, '')}
                    </div>
                </div>
            </div>`;
    }

    fetch('/json/knockout_pts.json')
        .then(response => response.json())
        .then(data => {
            const pData = data[rawName] || {};
            document.getElementById('totalBox').innerHTML = `
                <div class="total-box">
                    <div class="total-val">${pData.total_points ?? '—'}</div>
                </div>`;

            const rounds = [
                { key: 'round_of_32',   title: 'Round-of-32' },
                { key: 'round_of_16',   title: 'Round-of-16' },
                { key: 'quarterfinals', title: 'Quarter-finals' },
                { key: 'semifinals',    title: 'Semi-finals' },
                { key: 'finals',        title: 'Finals' },
                { key: 'champions',     title: 'CHAMPIONS' }
            ];

            let html = '';

            rounds.forEach(r => {
                const games = pData[r.key] || [];

                if (games.length === 0) return;

                if (r.key === 'champions') {
                    html += buildChampionCard(r.title, games[0]);
                } else {
                    html += buildRoundCard(r.title, games);
                }
            });
            document.getElementById('content').innerHTML = html;
        });
</script>

<div id="chatbot-placeholder"></div>
<script>
  fetch('/chatbot.html')
    .then(r => r.text())
    .then(html => {
      const placeholder = document.getElementById('chatbot-placeholder');
      // Inject the non-script HTML
      placeholder.innerHTML = html;
      // Re-execute any scripts manually
      placeholder.querySelectorAll('script').forEach(oldScript => {
        const newScript = document.createElement('script');
        newScript.textContent = oldScript.textContent;
        document.body.appendChild(newScript);
      });
    });
</script>
</body>
</html>
