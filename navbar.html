<script>
(function() {
    const currentPage = window.location.pathname.split('/').pop();
    const statsPages = [
        'group-matches-accuracy.htm',
        'individual-groups.htm',
        'bracket-matchups.htm',
        'bracket-accuracy.htm',
        'top-bonus-answers.htm'
    ];

    // Highlight matching nav-link
    document.querySelectorAll('.nav-link:not(.dropdown-toggle):not(.dropdown-item)').forEach(function(link) {
        const linkPage = link.getAttribute('href').split('/').pop();
        if (linkPage === currentPage) {
            link.classList.add('active');
        }
    });

    // If current page is a stats sub-page, highlight the Stats dropdown toggle
    if (statsPages.includes(currentPage)) {
        document.getElementById('statsDropdown').classList.add('active');
        // Also highlight the matching dropdown item
        document.querySelectorAll('.dropdown-item').forEach(function(item) {
            if (item.getAttribute('href').split('/').pop() === currentPage) {
                item.classList.add('active');
            }
        });
    }

    // Special case: index.html or root path
    if (currentPage === 'index.html' || currentPage === '') {
        document.querySelector('.nav-link[href="/index.html"]').classList.add('active');
    }
})();
</script>
