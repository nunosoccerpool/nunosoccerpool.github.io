<style>
/* CHAT WIDGET */
#chat-widget { position: fixed; bottom: 20px; right: 20px; z-index: 2147483647; font-family: sans-serif; }
#chat-box {
    display: none; width: 320px; height: 420px; background: #ffffff;
    border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    flex-direction: column; overflow: hidden; border: 1px solid #ccc;
}
#chat-header {
    background: #4285f4; color: #ffffff; padding: 14px 16px; font-weight: 600;
}
#close-chat { float: right; cursor: pointer; padding: 0 5px; }
#messages {
    flex: 1; overflow-y: auto; padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
    background: #ffffff; color: #333333;
}
#chat-input-row {
    padding: 10px; border-top: 1px solid #eee;
    display: flex; gap: 8px; background: #ffffff;
}
#user-input {
    flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 8px;
    outline: none; font-size: 14px; color: #000000; background-color: #ffffff;
}
#send-btn {
    background: #4285f4; color: #ffffff; border: none;
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600;
}
#chat-toggle {
    background: #4285f4; color: #ffffff; border: none; border-radius: 50%;
    width: 56px; height: 56px; font-size: 24px; cursor: pointer;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3); display: block;
    margin-left: auto; margin-top: 10px;
}
</style>

<div id="chat-widget">
    <div id="chat-box">
        <div id="chat-header">
            💬 Ask me something about the pool
            <span id="close-chat">✕</span>
        </div>
        <div id="messages"></div>
        <div id="chat-input-row">
            <input id="user-input" placeholder="Type a question..." type="text"/>
            <button id="send-btn">Send</button>
        </div>
    </div>
    <button id="chat-toggle">💬</button>
</div>

<script>
(function() {
    const history = [];

    document.getElementById("chat-toggle").onclick = () => {
        const box = document.getElementById("chat-box");
        box.style.display = (box.style.display === "none" || box.style.display === "") ? "flex" : "none";
        if (box.style.display === "flex") {
            setTimeout(() => document.getElementById("user-input").focus(), 100);
        }
    };

    document.getElementById("close-chat").onclick = () => {
        document.getElementById("chat-box").style.display = "none";
    };

    document.getElementById("send-btn").onclick = sendMessage;
    document.getElementById("user-input").onkeydown = e => {
        if (e.key === "Enter") { e.preventDefault(); sendMessage(); }
    };

    function addMessage(role, text) {
        const el = document.createElement("div");
        el.style.cssText = `padding:8px 12px;border-radius:10px;max-width:85%;word-wrap:break-word;font-size:14px;margin-bottom:4px;
            ${role === "user" ? "background:#4285f4;color:#fff;align-self:flex-end" : "background:#f1f1f1;color:#333;align-self:flex-start"}`;
        el.textContent = text;
        const msgDiv = document.getElementById("messages");
        msgDiv.appendChild(el);
        msgDiv.scrollTop = msgDiv.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById("user-input");
        const text = input.value.trim();
        if (!text) return;

        input.value = "";
        addMessage("user", text);
        history.push({ role: "user", content: text });

        const thinking = document.createElement("div");
        thinking.id = "thinking";
        thinking.style.cssText = "color:#999;font-size:13px;padding:4px 8px";
        thinking.textContent = "Talking to server...";
        document.getElementById("messages").appendChild(thinking);

        try {
            const res = await fetch("https://nunosoccerpool-github-io.vercel.app/api/chat?t=" + Date.now(), {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ messages: history })
            });

            document.getElementById("thinking")?.remove();

            if (!res.ok) {
                const errText = await res.text();
                addMessage("assistant", "Error " + res.status + ": " + errText);
                return;
            }

            const data = await res.json();
            if (data.reply) {
                addMessage("assistant", data.reply);
                history.push({ role: "assistant", content: data.reply });
            }
        } catch (err) {
            document.getElementById("thinking")?.remove();
            addMessage("assistant", "Network error: " + err.message);
        }
    }
})();
</script>
